name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      enable_qnn:
        description: "Bật QNN NPU (mục 63 TECHNICAL_STATUS.md) — CẦN secret QNN_SDK_BASE64 (Qualcomm SDK, tự chuẩn bị — xem HUONG_DAN_NPU_QNN.md Phần 2, KHÔNG có workflow convert_qnn_offline.yml riêng, quyết định mục 90 TECHNICAL_STATUS.md: dùng notebook mangalocal_qnn_convert.ipynb chạy trên Kaggle thay vì GitHub Actions cho việc convert model). Để false nếu không có SDK, build vẫn ra APK bình thường (CPU/OpenCL, giống mặc định từ trước)."
        default: false
        type: boolean
        required: false
      qnn_mode:
        description: "Chỉ dùng nếu enable_qnn=true — 'online' (biên dịch lúc chạy, đơn giản hơn) hoặc 'offline' (nạp file convert sẵn, đúng cách local-dream dùng — xem mục 62)"
        default: "online"
        required: false
      qnn_hexagon_arch:
        description: "Chỉ dùng nếu enable_qnn=true — HEXAGON_ARCH đích (SM8350/Snapdragon 888=68 — máy dev chính của dự án, mục 65; 8Gen1=69, 8Gen2=73, 8Gen3=75, 8Elite=79). CHỈ ảnh hưởng chế độ 'online' (chế độ 'offline' không cần vì mỗi model .mnn tự mang đúng kiến trúc đã convert)."
        default: "68"
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Auto-unzip source (nếu upload dạng zip qua web)
        run: |
          ZIP_FILE=$(find . -name "*.zip" -not -path "*/.git/*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Tìm thấy $ZIP_FILE, đang giải nén..."
            unzip -q "$ZIP_FILE" -d /tmp/extracted
            PROJECT_ROOT=$(find /tmp/extracted -maxdepth 3 -name "settings.gradle" -exec dirname {} \; | head -n 1)
            if [ -z "$PROJECT_ROOT" ]; then
              echo "❌ Không tìm thấy settings.gradle trong zip"
              exit 1
            fi
            echo "Project root: $PROJECT_ROOT"
            rsync -a --exclude='.github' "$PROJECT_ROOT"/ "$GITHUB_WORKSPACE"/
            rm -f "$ZIP_FILE"
            echo "✅ Giải nén xong"
          else
            echo "Không có file zip, dùng source đã checkout sẵn"
          fi

      - name: Install Rust toolchain (cho tokenizers-cpp, cross-compile Android)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          $HOME/.cargo/bin/rustup target add aarch64-linux-android
          # mục 252 — in phiên bản Rust/cargo THẬT đang dùng (toolchain "stable" không ghim,
          # đổi theo thời gian) để lần sau lỗi cargo/tokenizers-cpp có số phiên bản để đối chiếu.
          $HOME/.cargo/bin/rustc --version
          $HOME/.cargo/bin/cargo --version

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # mục 210 TECHNICAL_STATUS.md — Build APK #112 THẬT (log user gửi) lỗi
      # NGAY ở bước này, KHÔNG liên quan gì code mục 203-209 — lỗi hạ tầng
      # CI: `android-actions/setup-android@v3` mặc định tự chạy
      # `sdkmanager tools platform-tools` bên trong action, và Google đã
      # NGỪNG phục vụ gói `tools` (cũ, deprecated từ lâu) khỏi repository
      # SDK trong vài ngày gần đây — lỗi "Warning: Failed to find package
      # 'tools'" xảy ra HÀNG LOẠT trên rất nhiều repo khác (đã tra chéo 8
      # nguồn độc lập trên GitHub — cùng triệu chứng, cùng bản chất, cùng
      # cách vá: truyền `packages:` tường minh để bỏ hẳn "tools" khỏi danh
      # sách action tự cài, KHÔNG đổi hành vi gì khác). Dự án này vốn
      # không cần gói `tools` cũ (Gradle build hiện đại không dùng) —
      # `platform-tools` giữ lại vì các dự án tham khảo đều giữ (an toàn
      # hơn dùng chuỗi rỗng), bước "Install NDK & CMake" ngay dưới không
      # đổi gì.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 10406996
          packages: "platform-tools"

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" 2>/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build
          # KHÔNG cài libvulkan-dev/glslang-tools nữa — không còn dùng
          # Vulkan cho sd.cpp/ncnn (đã bỏ hoàn toàn 2 engine này).
          # MNN OpenCL tự vendor header, không cần gói hệ thống riêng.

      - name: Cache third-party
        uses: actions/cache@v4
        id: tp-cache
        with:
          path: app/src/main/jni/third_party
          key: tp-mnn-v5-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Clone third-party libraries
        if: steps.tp-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/jni/third_party
          cd app/src/main/jni/third_party
          # mục 252 TECHNICAL_STATUS.md — GHIM THEO NGÀY cho các repo không có tag ổn định
          # (stb, tokenizers-cpp). Bằng chứng từ log Build #123: bước "Cache third-party" 1s
          # (không có gì để tải) + bước "Clone third-party libraries" 17s => cache BỊ MISS và
          # 3 repo không ghim (stb, tokenizers-cpp+submodule, nlohmann/json) đã bị clone lại ở
          # bản MỚI NHẤT — đúng rủi ro từng gây build #34 (xtensor) và #59 (MNN). Cache chỉ
          # được GHI khi job thành công và bị xoá sau 7 ngày không dùng, nên chuỗi build lỗi
          # liên tiếp làm cache không bao giờ được dựng lại. Hàm dưới checkout commit CUỐI CÙNG
          # trước mốc 2026-09-19 (ngày build #117/#118 còn PASS); nếu không dựng được lịch sử
          # (repo ít commit) thì RƠI VỀ hành vi cũ (--depth 1) — không bao giờ làm clone hỏng.
          CUTOFF="2026-09-19T00:00:00Z"
          clone_at_cutoff() {
            local url="$1" dir="$2" recurse="$3"
            if git clone --shallow-since="2026-01-01" "$url" "$dir" 2>/dev/null; then
              ( cd "$dir"
                sha=$(git rev-list -n 1 --before="$CUTOFF" HEAD 2>/dev/null || true)
                if [ -n "$sha" ]; then
                  git checkout -q "$sha" && echo "  $dir ghim tại $sha (<= $CUTOFF)"
                else
                  echo "  $dir: không có commit nào trước mốc trong lịch sử tải về — giữ HEAD"
                fi
                if [ "$recurse" = "1" ]; then
                  git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
                fi
              )
            else
              rm -rf "$dir"
              echo "  $dir: --shallow-since không dùng được — rơi về clone --depth 1 (HEAD)"
              if [ "$recurse" = "1" ]; then
                git clone --depth 1 --recurse-submodules "$url" "$dir"
              else
                git clone --depth 1 "$url" "$dir"
              fi
            fi
          }
          echo "Cloning MNN (thay stable-diffusion.cpp+ncnn CHO ẢNH, thay llama.cpp CHO LLM — dùng chung 1 thư viện)..."
          # GHIM VERSION (sau lỗi build #59 — xem ghi chú trong bước "Vá
          # CMakeLists.txt của MNN" bên dưới): trước đây `git clone --depth 1`
          # không ghim nhánh cụ thể, nên mỗi lần cache miss sẽ kéo về đúng
          # bản MỚI NHẤT của MNN tại thời điểm đó — một ngày nào đó MNN đổi
          # cấu trúc CMakeLists.txt là cả workflow sập, y hệt rủi ro đã từng
          # gặp với xtensor (mục 36 TECHNICAL_STATUS.md) chỉ khác là lần này
          # là MNN. Ghim vào 3.6.1 (bản ổn định mới nhất đã kiểm tra hoạt
          # động được với project này) để build không còn phụ thuộc vào
          # đúng lúc nào GitHub cache bị miss nữa.
          git clone --depth 1 --branch 3.6.1 https://github.com/alibaba/MNN.git
          echo "Cloning stb (dùng cho ESRGAN/YOLO + SD engine đọc/ghi ảnh)..."
          clone_at_cutoff https://github.com/nothings/stb.git stb 0
          echo "Cloning xtensor + phụ thuộc (dùng bởi sd_engine, port từ local-dream)..."
          # GHIM VERSION — phát hiện qua log build #34: clone --depth 1 (nhánh
          # mặc định, không ghim) đã kéo về bản xtensor MỚI HƠN đã tái cấu trúc
          # thư mục header (0.26.0 trở đi dồn xadapt.hpp v.v. vào containers/,
          # core/... thay vì để phẳng ngay dưới xtensor/) — trong khi
          # sd_engine/Pipeline.hpp (port từ local-dream) viết include kiểu cũ
          # #include <xtensor/xadapt.hpp>, không tồn tại nữa ở bản mới -> lỗi
          # "file not found". Đây đúng là rủi ro "chưa ghim version" đã cảnh
          # báo từ trước (xem TECHNICAL_STATUS.md mục 36) — giờ xử lý dứt điểm
          # bằng cách ghim 4 version xtensor-stack tương thích nhau (theo đúng
          # bảng dependency chính chủ của xtensor-stack, đã tra cứu xác nhận):
          # xtensor 0.25.0 (bản MỚI NHẤT còn layout phẳng) cần xtl ^0.7.0 +
          # xsimd ^10.0.0; xtensor-blas 0.21.0 cần xtensor ^0.25.0.
          git clone --depth 1 --branch 0.7.7 https://github.com/xtensor-stack/xtl.git xtl
          git clone --depth 1 --branch 10.0.0 https://github.com/xtensor-stack/xsimd.git xsimd
          git clone --depth 1 --branch 0.25.0 https://github.com/xtensor-stack/xtensor.git xtensor
          git clone --depth 1 --branch 0.21.0 https://github.com/xtensor-stack/xtensor-blas.git xtensor-blas
          echo "Cloning tokenizers-cpp (wrapper C++ quanh tokenizer Rust)..."
          clone_at_cutoff https://github.com/mlc-ai/tokenizers-cpp.git tokenizers-cpp 1
          echo "Cloning nlohmann/json (đọc model_manifest.json)..."
          # nlohmann/json: nhánh mặc định là `develop` (tiền-phát-hành 4.0) — dùng tag ổn định.
          # Dự án chỉ dùng parse()/exception cơ bản (mnn_diffusion_pipeline.cpp, SafeTensorReader.hpp).
          git clone --depth 1 --branch v3.11.3 https://github.com/nlohmann/json.git

      - name: Vá CMakeLists.txt của MNN — OBJECT không được gắn PRE_BUILD/POST_BUILD (lỗi CXX1429)
        run: |
          # Lỗi build đầu tiên (xem log_build_fail.txt): CMake 3.22.1 từ chối
          # add_custom_command(POST_BUILD) trên target kiểu OBJECT library.
          # 2 target lỗi: MNNOpenCV (tools/cv/CMakeLists.txt) và llm
          # (transformers/llm/engine/CMakeLists.txt) — cả 2 đều gọi
          # add_custom_command(POST_BUILD ...) ngay sau add_library(... OBJECT ...)
          # trong nhánh MNN_SEP_BUILD=OFF (nhánh mặc định của project này).
          # Đây là lỗi trong chính CMakeLists.txt của MNN (đã xảy ra với target
          # khác từ 2022, đã tra cứu trước đó), không phải file project viết —
          # nên vá ngay sau khi clone, không đụng gì trong repo MNN gốc trừ 2 dòng này.
          # Cách sửa: đổi OBJECT -> STATIC cho đúng 2 dòng add_library() gây lỗi
          # (STATIC được phép gắn PRE_BUILD/POST_BUILD, OBJECT thì không).
          # SỬA (sau lỗi build #59): trước đây 2 bước vá dưới đây BẮT BUỘC
          # phải tìm thấy đúng dòng "add_library(... OBJECT ..." rồi mới cho
          # build tiếp — nếu không thấy thì exit 1, sập cả workflow. Nhưng
          # MNN được clone bằng `--depth 1` KHÔNG ghim version (khác xtensor —
          # xem ghi chú ghim version phía trên), nên mỗi lần cache miss là
          # kéo về bản MNN MỚI NHẤT tại thời điểm đó, có thể khác hẳn bản đã
          # dùng lúc viết patch này. Build #59 chứng minh đúng điều đó: MNN
          # mới đã tự đổi tools/cv/CMakeLists.txt — thực ra KHÔNG CÒN CẦN vá
          # MNNOpenCV nữa vì project này set MNN_BUILD_OPENCV=OFF, và bản MNN
          # hiện tại đã tự gói add_subdirectory(tools/cv) trong
          # IF(MNN_BUILD_OPENCV) — OFF thì CMake không đọc file đó nữa, nên
          # dò không thấy dòng cũ là chuyện BÌNH THƯỜNG, không phải lỗi.
          # Đổi cả 2 bước thành "vá nếu thấy, bỏ qua + cảnh báo nếu không
          # thấy" thay vì chết cứng — nếu MNN_BUILD_LLM=ON mà bản mới vẫn còn
          # lỗi CXX1429 thật, nó sẽ lộ ra ở đúng bước build native bên dưới
          # với thông báo lỗi CMake gốc, dễ chẩn đoán hơn nhiều so với việc
          # cả workflow chết ngay từ bước vá này.
          MNN_DIR="app/src/main/jni/third_party/MNN"

          CV_FILE="$MNN_DIR/tools/cv/CMakeLists.txt"
          if grep -q 'add_library(MNNOpenCV OBJECT' "$CV_FILE"; then
            sed -i 's/add_library(MNNOpenCV OBJECT/add_library(MNNOpenCV STATIC/' "$CV_FILE"
            echo "✅ Vá MNNOpenCV: OBJECT -> STATIC"
          else
            echo "⚠️  Không thấy dòng add_library(MNNOpenCV OBJECT ...) trong bản MNN này — bỏ qua bước vá (project set MNN_BUILD_OPENCV=OFF nên file này có thể không còn được CMake đọc tới; không phải lỗi)."
          fi

          LLM_FILE="$MNN_DIR/transformers/llm/engine/CMakeLists.txt"
          if grep -q 'add_library(llm OBJECT' "$LLM_FILE"; then
            sed -i 's/add_library(llm OBJECT/add_library(llm STATIC/' "$LLM_FILE"
            echo "✅ Vá llm: OBJECT -> STATIC"
          else
            echo "⚠️  Không thấy dòng add_library(llm OBJECT ...) trong bản MNN này — bỏ qua bước vá. Nếu bản MNN mới vẫn còn lỗi CXX1429 thật cho target 'llm', nó sẽ hiện rõ ở bước build native bên dưới."
          fi

      - name: Copy stb headers
        run: |
          cp app/src/main/jni/third_party/stb/stb_image.h app/src/main/jni/stb_image.h
          cp app/src/main/jni/third_party/stb/stb_image_write.h app/src/main/jni/stb_image_write.h
          # stb_image_resize2.h: cần cho sd_engine/SDUtils.hpp (port từ
          # local-dream) — copy vào jni/sd_engine để #include "stb_image_resize2.h"
          # (đường dẫn tương đối) tìm thấy đúng chỗ.
          mkdir -p app/src/main/jni/sd_engine
          cp app/src/main/jni/third_party/stb/stb_image_resize2.h app/src/main/jni/sd_engine/stb_image_resize2.h
          cp app/src/main/jni/third_party/stb/stb_image.h app/src/main/jni/sd_engine/stb_image.h
          cp app/src/main/jni/third_party/stb/stb_image_write.h app/src/main/jni/sd_engine/stb_image_write.h

      - name: Print MNN diffusion headers (chẩn đoán bắt buộc trước khi viết mnn_diffusion_pipeline.cpp)
        run: |
          echo "===== transformers/diffusion (nếu tồn tại) ====="
          find app/src/main/jni/third_party/MNN/transformers/diffusion -type f \( -name "*.hpp" -o -name "*.h" \) 2>/dev/null -exec echo "--- {} ---" \; -exec cat {} \; || echo "KHÔNG có thư mục transformers/diffusion trong bản MNN này — cần xem lại giả định MNN_BUILD_DIFFUSION"
          echo "===== include/MNN (API core, để tham khảo Interpreter/Session/Tensor) ====="
          find app/src/main/jni/third_party/MNN/include/MNN -maxdepth 1 -name "*.hpp" | sort
          echo "===== Danh sách toàn bộ file trong transformers/ (map cấu trúc thật) ====="
          find app/src/main/jni/third_party/MNN/transformers -maxdepth 3 -type d 2>/dev/null

      - name: Print sd_engine third-party header locations (chẩn đoán đường dẫn include)
        run: |
          echo "===== nlohmann/json — kiểm tra json.hpp nằm ở single_include hay include ====="
          find app/src/main/jni/third_party/json -iname "json.hpp" | sort
          echo "===== tokenizers-cpp — kiểm tra tokenizers_cpp.h nằm ở đâu ====="
          find app/src/main/jni/third_party/tokenizers-cpp -iname "tokenizers_cpp.h" -o -iname "CMakeLists.txt" | sort
          echo "===== xtensor/xtl/xsimd — kiểm tra header nằm ở include/ hay gốc ====="
          find app/src/main/jni/third_party/xtensor -maxdepth 2 -type d | sort
          find app/src/main/jni/third_party/xtl -maxdepth 2 -type d | sort
          find app/src/main/jni/third_party/xsimd -maxdepth 2 -type d | sort

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Bước tải model MediaPipe Face Detector/Hand Landmarker ĐÃ XOÁ (mục 20
      # TECHNICAL_STATUS.md) — FaceHandDetector.kt giờ tái dùng khung xương
      # YOLOv8-pose (yolov8_pose.mnn, chuẩn bị qua prepare_models.yml), không
      # còn cần model MediaPipe nào nữa. Dependency com.google.mediapipe cũng
      # đã bỏ khỏi app/build.gradle.

      - name: Giải nén QNN SDK nếu bật enable_qnn (mục 63 TECHNICAL_STATUS.md)
        if: ${{ github.event.inputs.enable_qnn == 'true' }}
        env:
          QNN_SDK_BASE64: ${{ secrets.QNN_SDK_BASE64 }}
        run: |
          if [ -z "$QNN_SDK_BASE64" ]; then
            echo "❌ enable_qnn=true nhưng thiếu secret QNN_SDK_BASE64."
            echo "   Không có workflow convert_qnn_offline.yml riêng cho việc này"
            echo "   (mục 90 TECHNICAL_STATUS.md — quyết định dùng notebook"
            echo "   mangalocal_qnn_convert.ipynb chạy trên Kaggle thay vì GitHub"
            echo "   Actions). Xem HUONG_DAN_NPU_QNN.md Phần 2 để biết cách tải"
            echo "   QNN SDK từ Qualcomm rồi tự base64 -w0 file .zip đó và lưu"
            echo "   vào đúng secret QNN_SDK_BASE64 (Settings -> Secrets and"
            echo "   variables -> Actions) trước khi chạy lại workflow này."
            exit 1
          fi
          echo "$QNN_SDK_BASE64" | base64 -d > qnn_sdk.zip
          mkdir -p qnn_sdk
          unzip -q qnn_sdk.zip -d qnn_sdk
          QNN_ROOT=$(find qnn_sdk -maxdepth 3 -type d -name "lib" -exec dirname {} \; | head -n 1)
          if [ -z "$QNN_ROOT" ]; then
            echo "❌ Không tìm thấy thư mục 'lib' trong QNN SDK đã giải nén"
            exit 1
          fi
          echo "QNN_SDK_ROOT_RESOLVED=$QNN_ROOT" >> $GITHUB_ENV
          echo "✅ QNN SDK root: $QNN_ROOT"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # mục 252 — biên dịch RIÊNG Kotlin (không cần native, nhanh) TRƯỚC build đầy đủ.
      # Lý do: khi bước native lỗi, Gradle dừng và KHÔNG ai biết Kotlin (23 file mới/sửa từ
      # mục 214 đến 251, chưa từng qua kotlinc) có lỗi hay không. continue-on-error: không
      # chặn bước build bên dưới; chỉ để lộ lỗi Kotlin ngay trong lần chạy này.
      - name: Kotlin preflight (compileDebugKotlin riêng — chỉ để lộ lỗi sớm)
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin \
            -Pandroid.ndkVersion=25.2.9519653 \
            --no-daemon 2>&1 | tee kotlin_preflight.log | grep -E "^e: |BUILD (SUCCESSFUL|FAILED)|What went wrong|Execution failed" | head -100 | cut -c1-500 || true
          echo "(log Kotlin đầy đủ: kotlin_preflight.log — được upload nếu job lỗi)"
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: Build debug APK
        run: |
          set -o pipefail
          echo "=== Tài nguyên runner ==="; nproc; free -m | head -2
          QNN_GRADLE_ARGS=""
          if [ "${{ github.event.inputs.enable_qnn }}" = "true" ]; then
            QNN_GRADLE_ARGS="-Pmangalocal.enableQnn=true -Pmangalocal.qnnSdkRoot=$QNN_SDK_ROOT_RESOLVED -Pmangalocal.qnnMode=${{ github.event.inputs.qnn_mode || 'online' }} -Pmangalocal.qnnHexagonArch=${{ github.event.inputs.qnn_hexagon_arch || '68' }}"
            echo "Build voi QNN: $QNN_GRADLE_ARGS"
          fi
          # mục 252 — TRƯỚC ĐÂY: `--stacktrace 2>&1 | tail -300`. Stack trace Gradle dài hàng
          # trăm dòng nên `tail -300` CẮT MẤT thông báo lỗi gốc của ninja/clang nằm ở đầu
          # ngoại lệ (log Build #123 chỉ còn phần đuôi stack trace + "BUILD FAILED", không có
          # dòng "FAILED:"/"error:"). Nay: ghi log ĐẦY ĐỦ ra build_full.log (không --stacktrace,
          # không tail) rồi hai bước `if: failure()` bên dưới in tóm tắt lỗi ở CUỐI log.
          ./gradlew assembleDebug \
            -Pandroid.ndkVersion=25.2.9519653 \
            $QNN_GRADLE_ARGS \
            --no-daemon 2>&1 | tee build_full.log
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: "[CHỈ KHI LỖI] Tóm tắt dòng lỗi từ log đầy đủ"
        if: failure()
        run: |
          [ -f build_full.log ] || { echo "Không có build_full.log (lỗi xảy ra trước bước Gradle)"; exit 0; }
          echo "=== Dòng lỗi trong build_full.log (tối đa 150) ==="
          grep -nE "^e: |error:|^FAILED:|undefined (reference|symbol)|ld\.lld: error|clang(\+\+)?: error|Killed|What went wrong|Execution failed|cargo|rustc" build_full.log | head -150 | cut -c1-500 || true

      # mục 252 — chạy lại ninja ĐÚNG danh sách target mà Gradle đã gọi nhưng với `-k 0`
      # (không dừng ở lỗi đầu tiên → liệt kê MỌI file lỗi trong MỘT lần chạy) và `-j2`
      # (nếu lần này KHÔNG lỗi nữa => nguyên nhân gốc là HẾT BỘ NHỚ khi biên dịch song song).
      # Các file đã biên dịch xong ở lần trước được dùng lại nên bước này nhanh.
      - name: "[CHỈ KHI LỖI] Liệt kê TOÀN BỘ lỗi native (ninja -k 0 -j2)"
        if: failure()
        continue-on-error: true
        run: |
          echo "=== Bộ nhớ/CPU runner ==="; nproc; free -m | head -2
          sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process" | tail -5 || true
          BD=$(ls -d app/.cxx/Debug/*/arm64-v8a 2>/dev/null | head -1)
          if [ -z "$BD" ]; then echo "Không thấy thư mục build native — lỗi xảy ra trước bước native."; exit 0; fi
          NINJA="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/ninja"
          [ -x "$NINJA" ] || NINJA=ninja
          ARGS=$(grep -m1 -o 'bin/ninja with arguments {[^}]*}' build_full.log 2>/dev/null | sed 's/.*{\(.*\)}/\1/' || true)
          [ -n "$ARGS" ] || ARGS="-C $BD mangalocal_native"
          echo "ninja -k 0 -j2 $ARGS"
          set +e
          "$NINJA" -k 0 -j2 $ARGS > ninja_k0.log 2>&1
          echo "Mã thoát ninja -k 0 -j2: $?"
          echo "=== Mọi lệnh lỗi (FAILED:) ==="
          grep -n "^FAILED:" ninja_k0.log | cut -c1-300
          echo "=== Chi tiết lỗi (tối đa 200 dòng) ==="
          grep -nE "error:|undefined (reference|symbol)|ld\.lld: error|Killed|fatal" ninja_k0.log | head -200 | cut -c1-500
          echo "=== 40 dòng cuối ninja_k0.log ==="
          tail -40 ninja_k0.log | cut -c1-500

      - name: "[CHỈ KHI LỖI] Upload log lỗi"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_full.log
            kotlin_preflight.log
            ninja_k0.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaLocal-v4-MNN
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 60

      - name: Result
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "✅ BUILD THÀNH CÔNG"
            ls -lh "$APK"
          else
            echo "❌ FAILED"
            exit 1
          fi
